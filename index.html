<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi canal</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 25px;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 50px;
        }

        .programas {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px 25px;
}

.programa {
    margin-bottom: 0;
}
        }

        .video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #222;
        }

        .video iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            margin-top: 25px;
        }@media (max-width: 700px) {
    .programas {
        grid-template-columns: 1fr;
    }
}

    </style>
</head>

<body>

<main>

    <h1>La biblioteca de Majinken</h1>

    <div class="programas">

    <div class="programa">

        ... primer vídeo ...

    </div>


    <div class="programa">

        ... segundo vídeo ...

    </div>

</div>


   
</main>

<script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
